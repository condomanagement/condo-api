# Ruby CircleCI 2.0 configuration file
#
# Check https://circleci.com/docs/2.0/language-ruby/ for more details
#
version: 2
jobs:
  build:
    docker:
      # specify the version you desire here
      - image: cimg/ruby:3.4.7-node
        environment:
          - PG_HOST=localhost
          - PG_USER=ubuntu
          - RAILS_ENV=test
          - RACK_ENV=test
          - CI=true
      - image: cimg/postgres:16.4
        environment:
          - POSTGRES_USER=ubuntu
          - POSTGRES_DB=db_name
          - POSTGRES_HOST_AUTH_METHOD: trust
    working_directory: ~/repo

    steps:
      - checkout
      - run:
          command: "[[ ! -s \"$(git rev-parse --git-dir)/shallow\" ]] || git fetch --unshallow"

      # Download and cache dependencies
      - restore_cache:
          keys:
          - gem-cache-{{ arch }}-{{ checksum "Gemfile.lock" }}
          # - v1-dependencies-{{ checksum "Gemfile.lock" }}
          # fallback to using the latest cache is found
          # - v1-dependencies-

      - run:
          name: Install dependencies
          command: |
            sudo apt-get update --allow-releaseinfo-change
            sudo apt-get install cmake yamllint
            gem install bundler
            npm install
            bundle install --jobs=4 --retry=3 --path vendor/bundle

      - run: sudo apt install -y postgresql-client || true

      - save_cache:
          key: gem-cache-{{ arch }}-{{ checksum "Gemfile.lock" }}
          paths:
            - vendor/bundle
            - ~/.cache/npm

      # Database setup
      - run:
          name: Load DB
          command: bundle exec rake db:create db:migrate
          environment:
            DATABASE_URL: "postgres://ubuntu@localhost:5432/db_name"

      # run tests!
      - run:
          name: Rubocop
          command: |
            mkdir /tmp/test-results
            bundle exec rubocop

      - run:
          name: Rake test
          command: bundle exec rake test
          environment:
            DATABASE_URL: "postgres://ubuntu@localhost:5432/db_name"

      - run:
          name: YAML lint
          command: yamllint config/locales/

      # collect reports
      - store_test_results:
          path: /tmp/test-results

      - store_artifacts:
          path: /tmp/test-results
          destination: test-results

